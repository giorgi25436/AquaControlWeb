<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aqua Control | Iniciar sesión</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">
    <main class="login-card">
        <img class="login-logo" src="{{ url_for('static', filename='img/logo-aqua-control.png') }}" alt="Aqua Control">
        <p class="eyebrow">Gestión operativa</p>
        <h1>AQUA CONTROL</h1>
        <p class="subtitle">Gestión de Personal Camaronero</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert {{ category }}" role="alert">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="post" class="login-form">
            <label for="username">Usuario</label>
            <input id="username" name="username" type="text" placeholder="Ingresa tu usuario"
                   autocomplete="username" required>

            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" placeholder="Ingresa tu contraseña"
                   autocomplete="current-password" required>

            <button type="submit" class="primary-button">Iniciar sesión <span aria-hidden="true">→</span></button>
        </form>
    </main>
</body>
</html>
